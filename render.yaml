services:
  - type: web
    name: mpc-nanoca-server
    runtime: docker
    plan: starter
    region: frankfurt
    autoDeploy: true
    healthCheckPath: /healthz
    envVars:
      - key: BASE_URL
        value: https://cert.mpc.ad
      # CA cert/key are pasted as PEM into the Render dashboard (sync: false
      # keeps the secret values out of this committed file). Generate them with
      # scripts/gen-ca.sh, then paste the printed PEM blocks here in Render.
      - key: CA_CERT_PEM
        sync: false
      - key: CA_KEY_PEM
        sync: false
      - key: BADGER_DIR
        value: /data/badger
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
